<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ecuación de Willis · Tren epicicloidal</title>
<style>
:root{--bg:#f2f5f8;--card:#fff;--fg:#10202e;--mu:#5c6b78;--ln:#cfd8e0;--gr:#e6ecf1;--sun:#e8a317;--pl:#1f9d8b;--rg:#7b5cd6;--ar:#5b6b7a;--ac:#d6361f;--bl:#1b5fa8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1722;--card:#12222f;--fg:#e4edf4;--mu:#92a4b3;--ln:#2a3e4f;--gr:#1a2d3c;--ac:#ff6a52;--bl:#6db0f2;--ar:#8fa1b1}}
:root[data-theme="dark"]{--bg:#0b1722;--card:#12222f;--fg:#e4edf4;--mu:#92a4b3;--ln:#2a3e4f;--gr:#1a2d3c;--ac:#ff6a52;--bl:#6db0f2;--ar:#8fa1b1}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
.w{max-width:1100px;margin:0 auto;padding:18px 14px 40px}
h1{font:600 24px/1.2 Georgia,Cambria,serif;margin:0 0 4px}
.sub{color:var(--mu);margin:0 0 16px;max-width:70ch}
.g{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px}
@media(max-width:820px){.g{grid-template-columns:1fr}}
.c{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:14px;min-width:0}
canvas{display:block;width:100%;aspect-ratio:1;border-radius:6px;background-image:linear-gradient(var(--gr) 1px,transparent 1px),linear-gradient(90deg,var(--gr) 1px,transparent 1px);background-size:24px 24px}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;color:var(--mu);font-size:13px}
.lg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
label,.lb{display:block;font-weight:600;margin:12px 0 4px;font-size:14px}
.lb:first-child{margin-top:0}
input[type=range]{width:100%;accent-color:var(--bl)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;border:1px solid var(--ln);background:var(--card);color:var(--fg);border-radius:7px;padding:5px 11px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--bl);outline-offset:2px}
button.on{background:var(--bl);border-color:var(--bl);color:#fff}
button[disabled]{opacity:.4;cursor:not-allowed}
.n{color:var(--mu);font-size:13px;margin:6px 0 0}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--ln);padding:5px 6px;text-align:center}
th{font-weight:600;color:var(--mu)}
td:first-child,th:first-child{text-align:left}
td small{display:block;color:var(--mu);font-size:12px}
.m{font-family:Georgia,Cambria,"Times New Roman",serif;font-size:17px}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px;line-height:1.25}
.fr>span:first-child{border-bottom:1px solid currentColor;padding:0 3px}
.eq{margin:10px 0;padding:10px 12px;background:var(--gr);border-radius:7px;overflow-x:auto;white-space:nowrap}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.nav{display:flex;align-items:center;gap:10px;margin-top:12px}
.nav span{color:var(--mu);font-size:13px}
.ok{color:var(--pl);font-weight:600}
.hl{background:var(--gr)}
.tw{overflow-x:auto}
</style></head><body><div class="w">
<h1>Ecuación de Willis en un tren epicicloidal</h1>
<p class="sub">Sol, satélites y corona sobre un brazo portasatélites. Fija un elemento, mueve otro y sigue la deducción por dos métodos.</p>
<div class="g">
 <div class="c"><canvas id="cv" role="img" aria-label="Animación del tren epicicloidal"></canvas>
  <div class="lg"><span><i style="background:var(--sun)"></i>Sol</span><span><i style="background:var(--pl)"></i>Satélites</span><span><i style="background:var(--rg)"></i>Corona</span><span><i style="background:var(--ar)"></i>Brazo</span><span id="md"></span></div></div>
 <div class="c">
  <div class="lb">Elemento fijo</div><div class="seg" id="fx"></div>
  <div class="lb">Elemento motriz</div><div class="seg" id="in"></div>
  <label for="wi">Velocidad de entrada: <b id="wiv"></b> rpm</label><input id="wi" type="range" min="-60" max="60" step="1" value="20">
  <label for="zs">Dientes del sol Z<sub>s</sub>: <b id="zsv"></b></label><input id="zs" type="range" min="12" max="40" value="24">
  <label for="zp">Dientes del satélite Z<sub>p</sub>: <b id="zpv"></b></label><input id="zp" type="range" min="10" max="28" value="18">
  <p class="n" id="geo"></p>
  <div class="seg" style="margin-top:10px"><button id="pl">Pausa</button><label style="margin:0;display:flex;align-items:center;gap:6px;font-weight:400">Ritmo <input id="sp" type="range" min="0.1" max="2" step="0.1" value="1" style="width:100px"></label></div>
  <div class="tw" style="margin-top:12px"><table id="inf"></table></div>
 </div>
</div>
<div class="c" style="margin-top:14px">
 <div class="tabs" id="tb"><button data-t="1" class="on">Método 1: inversión del movimiento</button><button data-t="2">Método 2: velocidades relativas</button><button data-t="3">Comparar</button></div>
 <div id="th"></div>
 <div class="nav" id="nv"><button id="pv">Anterior</button><button id="nx">Siguiente</button><span id="st"></span></div>
</div></div>
<script>
const $=s=>document.querySelector(s),TAU=Math.PI*2;
const NAME={s:'Sol',p:'Satélite',c:'Corona',b:'Brazo'},COL={s:'--sun',p:'--pl',c:'--rg',b:'--ar'},KEYS=['s','p','c','b'];
let S={Zs:24,Zp:18,fix:'c',inp:'s',win:20,mode:'real',tab:1,step:1,play:true,spd:1},th,sc=1;
const reset=()=>{th={s:0,p:0,c:0,b:0}};reset();
const Zc=()=>S.Zs+2*S.Zp,nP=()=>{const a=S.Zs+S.Zp;return a%3==0?3:a%2==0?4:2};
const n=x=>(Math.abs(x)<5e-3?'0':String(+x.toFixed(2))).replace('-','−');
const W=k=>`<i>ω</i><sub>${k}</sub>`,Z=k=>`<i>Z</i><sub>${k}</sub>`,R=k=>`<i>r</i><sub>${k}</sub>`,fr=(a,b)=>`<span class="fr"><span>${a}</span><span>${b}</span></span>`;
const coef=()=>({s:1,p:-S.Zs/S.Zp,c:-S.Zs/Zc(),b:0});
function solve(){const b=coef(),u=S.win/(b[S.inp]-b[S.fix]),wb=-b[S.fix]*u,w={};for(const k in b)w[k]=wb+b[k]*u;return{w,u,wb}}
function speeds(){const r=solve();if(S.mode==='x')return{s:r.wb,p:r.wb,c:r.wb,b:r.wb};if(S.mode==='y'){const o={};for(const k in r.w)o[k]=r.w[k]-r.wb;return o}return r.w}
/* ---------- dibujo ---------- */
function gp(g,Zn,rot,sg){const Rr=Zn/2*sc,p=TAU/Zn,a=sg*sc,d=-sg*1.25*sc;
 for(let i=0;i<Zn;i++){const c=rot+i*p;[[d,-.31],[a,-.18],[a,.18],[d,.31]].forEach(([h,f],j)=>{const r=Rr+h,t=c+f*p;(i+j?g.lineTo:g.moveTo).call(g,r*Math.cos(t),r*Math.sin(t))})}g.closePath()}
function arrow(g,x,y,dx,dy,col,lab){g.strokeStyle=g.fillStyle=col;g.lineWidth=2.5;g.beginPath();g.moveTo(x,y);g.lineTo(x+dx,y+dy);g.stroke();const L=Math.hypot(dx,dy);if(L>6){const a=Math.atan2(dy,dx);g.beginPath();g.moveTo(x+dx,y+dy);g.lineTo(x+dx-9*Math.cos(a-.4),y+dy-9*Math.sin(a-.4));g.lineTo(x+dx-9*Math.cos(a+.4),y+dy-9*Math.sin(a+.4));g.fill()}
 g.font='italic 15px Georgia,serif';g.fillText(lab,x+dx+(dx>=0?6:-18),y+dy+(dy>=0?14:-6))}
function draw(){const cv=$('#cv'),Wd=cv.clientWidth,dp=devicePixelRatio||1;if(cv.width!==Math.round(Wd*dp))cv.width=cv.height=Math.round(Wd*dp);
 const g=cv.getContext('2d'),cs=getComputedStyle(document.documentElement),C=k=>cs.getPropertyValue(k).trim();
 g.setTransform(dp,0,0,dp,0,0);g.clearRect(0,0,Wd,Wd);g.translate(Wd/2,Wd/2);
 const zc=Zc(),N=nP(),rs=S.Zs/2,rp=S.Zp/2,rc=zc/2;sc=(Wd/2-12)/(rc+3.5);
 const dl=(S.Zs/S.Zp)*0,del=k=>{const f=TAU*k/N;return f+Math.PI+S.Zs/S.Zp*f-Math.PI/S.Zp},rho=(S.Zp/zc)*(del(0)+Math.PI/S.Zp);
 g.lineWidth=1.2;g.strokeStyle=C('--fg');
 g.beginPath();g.arc(0,0,(rc+3)*sc,0,TAU);gp(g,zc,th.c+rho,-1);g.fillStyle=C('--rg');g.globalAlpha=.55;g.fill('evenodd');g.globalAlpha=1;g.stroke();
 g.beginPath();gp(g,S.Zs,th.s,1);g.fillStyle=C('--sun');g.fill();g.stroke();
 const ctr=k=>{const a=th.b+TAU*k/N,r=(rs+rp)*sc;return[r*Math.cos(a),r*Math.sin(a)]};
 for(let k=0;k<N;k++){const[x,y]=ctr(k);g.save();g.translate(x,y);g.beginPath();gp(g,S.Zp,th.p+del(k),1);g.fillStyle=C('--pl');g.fill();g.stroke();g.restore()}
 g.strokeStyle=C('--ar');g.globalAlpha=.7;g.lineWidth=6;g.lineCap='round';for(let k=0;k<N;k++){const[x,y]=ctr(k);g.beginPath();g.moveTo(0,0);g.lineTo(x,y);g.stroke()}g.globalAlpha=1;
 g.fillStyle=C('--ar');g.beginPath();g.arc(0,0,5,0,TAU);g.fill();for(let k=0;k<N;k++){const[x,y]=ctr(k);g.beginPath();g.arc(x,y,5,0,TAU);g.fill()}
 g.fillStyle=C('--ac');const dot=(r,a)=>{g.beginPath();g.arc(r*sc*Math.cos(a),r*sc*Math.sin(a),3.5,0,TAU);g.fill()};
 dot(rs*.55,th.s);for(let k=0;k<N;k++){const[x,y]=ctr(k);g.beginPath();g.arc(x+rp*.5*sc*Math.cos(th.p),y+rp*.5*sc*Math.sin(th.p),3.5,0,TAU);g.fill()}dot(rc+1.8,th.c);
 g.setLineDash([6,5]);g.strokeStyle=C('--ac');g.lineWidth=2;if(S.fix==='s'){g.beginPath();g.arc(0,0,(rs+1.8)*sc,0,TAU);g.stroke()}if(S.fix==='c'){g.beginPath();g.arc(0,0,(rc+3.6)*sc,0,TAU);g.stroke()}g.setLineDash([]);
 g.fillStyle=C('--ac');g.font='600 14px system-ui,sans-serif';g.textAlign='left';g.fillText('Fijo: '+NAME[S.fix],-Wd/2+10,-Wd/2+22);
 if(S.tab!==1&&S.mode==='real'){const st=S.tab===3?9:S.step,r=solve().w,a=th.b,e=[Math.cos(a),Math.sin(a)],nn=[-e[1],e[0]];
  const pos={A:rs,C:rs+rp,B:rc},v={A:r.s*rs,C:r.b*(rs+rp),B:r.c*rc},mx=Math.max(1e-9,Math.abs(v.A),Math.abs(v.B),Math.abs(v.C)),k=Math.min(Wd*.2,60)/mx;
  const P=(q)=>[e[0]*pos[q]*sc,e[1]*pos[q]*sc],V=(q)=>[nn[0]*v[q]*k,nn[1]*v[q]*k],bl=C('--bl');
  const show=['A','B','C'].filter(q=>q==='A'?st>=1:q==='B'?st>=2:st>=3);
  if(st>=3){g.setLineDash([4,4]);g.strokeStyle=bl;g.lineWidth=1.5;g.beginPath();const a1=P('A'),b1=P('B'),va=V('A'),vb=V('B');g.moveTo(a1[0]+va[0],a1[1]+va[1]);g.lineTo(b1[0]+vb[0],b1[1]+vb[1]);g.stroke();g.beginPath();g.moveTo(a1[0],a1[1]);g.lineTo(b1[0],b1[1]);g.stroke();g.setLineDash([]);
   if(Math.abs(v.B-v.A)>1e-6){const t=-v.A/(v.B-v.A),px=a1[0]+(b1[0]-a1[0])*t,py=a1[1]+(b1[1]-a1[1])*t;if(Math.hypot(px,py)<Wd*.7){g.fillStyle=bl;g.beginPath();g.arc(px,py,5,0,TAU);g.fill();g.font='italic 15px Georgia,serif';g.fillText('P',px+7,py-7)}}}
  show.forEach(q=>{const p=P(q),w=V(q);arrow(g,p[0],p[1],w[0],w[1],bl,'v'+q)})}
}
/* ---------- teoría ---------- */
const sq=(a,b)=>`${W(a)}<i>·</i>${R(b)}`;
function m1(){const r=solve(),b=coef(),x=r.wb,y=r.u,xs='<i>x</i>',ys='<i>y</i>',zsp=fr(Z('s'),Z('p')),zsc=fr(Z('s'),Z('c'));
 const rows=[['1) Giro conjunto',[xs,xs,xs,xs],[x,x,x,x]],['2) Brazo fijo, sol gira '+'y',['0',ys,`−${ys}${zsp}`,`−${ys}${zsc}`],[0,y,b.p*y,b.c*y]],['3) Suma',[xs,`${xs}+${ys}`,`${xs}−${ys}${zsp}`,`${xs}−${ys}${zsc}`],[r.w.b,r.w.s,r.w.p,r.w.c]]];
 const tb=`<div class="tw"><table class="m"><tr><th>Operación</th><th>Brazo</th><th>Sol</th><th>Satélite</th><th>Corona</th></tr>${rows.slice(0,Math.min(S.step,3)).map(([t,s,v],i)=>`<tr${i==S.step-1?' class="hl"':''}><td style="font-size:14px;font-family:system-ui">${t}</td>${s.map((q,j)=>`<td>${q}<small>${n(v[j])}</small></td>`).join('')}</tr>`).join('')}</table></div>`;
 const T=[
 ['Se congela el mecanismo (ningún engranaje rueda respecto a otro) y se gira todo como sólido rígido con velocidad angular +x. Es compatible con los engranes: la velocidad relativa en cada contacto es nula.',tb],
 ['Inversión del movimiento: se fija el brazo. El tren pasa a ser ordinario, de ejes fijos, y se gira el sol y. Engrane externo sol–satélite: invierte el sentido. Engrane interno satélite–corona: lo conserva.',tb+`<div class="eq m">${fr(W('p'),W('s'))} = −${zsp} &nbsp; ${fr(W('c'),W('p'))} = +${fr(Z('p'),Z('c'))} &nbsp;⇒&nbsp; ${fr(W('c'),W('s'))} = −${zsc}</div>`],
 ['Superposición: las condiciones de engrane son lineales en las velocidades angulares, así que el movimiento real es la suma de ambos. Se suma columna a columna.',tb],
 ['Identificación con el movimiento real: el brazo solo tiene x, luego x = '+W('b')+'. El sol tiene x + y = '+W('s')+', luego y = '+W('s')+' − '+W('b')+'.',tb+`<div class="eq m">${W('p')} = ${W('b')} − (${W('s')}−${W('b')})${zsp}<br>${W('c')} = ${W('b')} − (${W('s')}−${W('b')})${zsc}</div>`],
 ['Pasando ωb al primer miembro y dividiendo se obtiene la ecuación de Willis: la relación de transmisión del tren ordinario que resulta de fijar el brazo.',(()=>{const d=r.w.c-r.w.b,l=Math.abs(d)>1e-9?(r.w.s-r.w.b)/d:null;return`<div class="eq m">${fr(W('s')+'−'+W('b'),W('c')+'−'+W('b'))} = −${fr(Z('c'),Z('s'))} &nbsp;(${Z('c')} = ${Z('s')}+2${Z('p')})<br>${fr(W('p')+'−'+W('b'),W('s')+'−'+W('b'))} = −${zsp}</div><p class="n">Comprobación con los valores actuales: primer miembro = <span class="ok">${l===null?'indeterminado':n(l)}</span>, segundo miembro = <span class="ok">${n(-Zc()/S.Zs)}</span>.</p>`})()]];
 return T[S.step-1]}
function m2(){const r=solve().w,rs=S.Zs/2,rp=S.Zp/2,rc=Zc()/2,vA=r.s*rs,vB=r.c*rc,vC=r.b*(rs+rp);
 const T=[
 ['Contacto A (sol–satélite). No hay deslizamiento: el punto A del sol y el punto A del satélite tienen la misma velocidad. Sol: v<sub>A</sub> = '+sq('s','s')+'. Satélite (sólido rígido, centro C con velocidad '+W('b')+'(r<sub>s</sub>+r<sub>p</sub>)): ',`<div class="eq m">v<sub>A</sub> = ${sq('s','s')} = ${W('b')}(${R('s')}+${R('p')}) − ${sq('p','p')}</div><p class="n">Valor actual: v<sub>A</sub> = ${n(vA)} (unidades de módulo·rpm).</p>`],
 ['Contacto B (satélite–corona), análogo, con el punto B al otro lado del centro C, de modo que el término del giro propio cambia de signo.',`<div class="eq m">v<sub>B</sub> = ${sq('c','c')} = ${W('b')}(${R('s')}+${R('p')}) + ${sq('p','p')}</div><p class="n">Valor actual: v<sub>B</sub> = ${n(vB)}.</p>`],
 ['El satélite es un sólido rígido: a lo largo del diámetro AB la velocidad varía linealmente, y en el centro C vale la media. El punto donde la recta corta al eje es el centro instantáneo de rotación P.',`<div class="eq m">v<sub>C</sub> = ${fr('v<sub>A</sub> + v<sub>B</sub>','2')} = ${W('b')}(${R('s')}+${R('p')})</div><p class="n">Valores actuales: v<sub>C</sub> = ${n(vC)}, media de v<sub>A</sub> y v<sub>B</sub> = ${n((vA+vB)/2)}.</p>`],
 ['Sumando las expresiones de v<sub>A</sub> y v<sub>B</sub> desaparece la velocidad de giro propio del satélite, y como r<sub>c</sub> = r<sub>s</sub> + 2r<sub>p</sub>:',`<div class="eq m">${sq('s','s')} + ${sq('c','c')} = 2${W('b')}(${R('s')}+${R('p')}) = ${W('b')}(${R('s')}+${R('c')})</div>`],
 ['Agrupando términos y usando r = mZ/2 (el módulo m es común a todo el tren) queda la ecuación de Willis.',`<div class="eq m">${R('s')}(${W('s')}−${W('b')}) = −${R('c')}(${W('c')}−${W('b')}) &nbsp;⇒&nbsp; ${fr(W('s')+'−'+W('b'),W('c')+'−'+W('b'))} = −${fr(Z('c'),Z('s'))}</div>`]];
 return T[S.step-1]}
function cmp(){const zs=S.Zs,zp=S.Zp,zc=Zc(),f=(l,e,s,t,v)=>`<tr${l==S.fix?' class="hl"':''}><td>${NAME[l]}</td><td>${e}</td><td class="m">${s}</td><td>${n(v)}</td></tr>`;
 return`<p>Ambos caminos llegan a la misma relación. El método 1 se apoya en la superposición de dos movimientos y da de paso la ecuación del satélite; el método 2 parte de la cinemática del sólido rígido y la geometría r<sub>c</sub> = r<sub>s</sub> + 2r<sub>p</sub>, y elimina ω<sub>p</sub>.</p><div class="eq m">${fr(W('s')+'−'+W('b'),W('c')+'−'+W('b'))} = −${fr(Z('c'),Z('s'))} = ${n(-zc/zs)}</div>
 <p class="n">Fijando cada elemento, Willis da la relación de transmisión (valores para Z<sub>s</sub> = ${zs}, Z<sub>p</sub> = ${zp}, Z<sub>c</sub> = ${zc}):</p><div class="tw"><table><tr><th>Fijo</th><th>Entrada → salida</th><th>Relación</th><th>Valor</th></tr>
 ${f('c','sol → brazo',`${fr(W('b'),W('s'))} = ${fr(Z('s'),Z('s')+'+'+Z('c'))}`,0,zs/(zs+zc))}${f('s','corona → brazo',`${fr(W('b'),W('c'))} = ${fr(Z('c'),Z('s')+'+'+Z('c'))}`,0,zc/(zs+zc))}${f('b','sol → corona',`${fr(W('c'),W('s'))} = −${fr(Z('s'),Z('c'))}`,0,-zs/zc)}${f('p','brazo → sol',`${fr(W('s'),W('b'))} = 1+${fr(Z('p'),Z('s'))}`,0,1+zp/zs)}${f('p','brazo → corona',`${fr(W('c'),W('b'))} = 1−${fr(Z('p'),Z('c'))}`,0,1-zp/zc)}</table></div>`}
function theory(){const tot=S.tab===3?0:5;$('#th').innerHTML=S.tab===1?`<p>${m1()[0]}</p>${m1()[1]}`:S.tab===2?`<p>${m2()[0]}</p>${m2()[1]}`:cmp();
 $('#nv').style.display=tot?'flex':'none';$('#st').textContent=`Paso ${S.step} de 5`;$('#pv').disabled=S.step<=1;$('#nx').disabled=S.step>=5}
function info(){const r=solve().w;$('#inf').innerHTML=`<tr><th>Elemento</th><th>ω (rpm)</th><th>ω / ω<sub>entrada</sub></th></tr>`+['s','p','c','b'].map(k=>`<tr${k===S.fix?' class="hl"':''}><td>${NAME[k]}${k===S.fix?' (fijo)':k===S.inp?' (motriz)':''}</td><td>${n(r[k])}</td><td>${S.win?n(r[k]/S.win):'—'}</td></tr>`).join('');
 $('#geo').innerHTML=`Z<sub>c</sub> = Z<sub>s</sub> + 2Z<sub>p</sub> = <b>${Zc()}</b>. Satélites: <b>${nP()}</b> (montaje con paso uniforme: (Z<sub>s</sub>+Z<sub>c</sub>)/N entero).`;
 $('#wiv').textContent=S.win;$('#zsv').textContent=S.Zs;$('#zpv').textContent=S.Zp;
 $('#md').textContent=S.mode==='x'?'Mostrando: giro conjunto (x)':S.mode==='y'?'Mostrando: brazo fijo (y)':'Mostrando: movimiento real';
 document.querySelectorAll('#fx button').forEach(b=>b.classList.toggle('on',b.dataset.k===S.fix));
 document.querySelectorAll('#in button').forEach(b=>{b.classList.toggle('on',b.dataset.k===S.inp);b.disabled=b.dataset.k===S.fix})}
function setStep(i){S.step=i;S.mode=S.tab===1?(i==1?'x':i==2?'y':'real'):'real';reset();info();theory()}
const upd=()=>{reset();info();theory()};
['#fx','#in'].forEach(id=>{$(id).innerHTML=KEYS.map(k=>`<button data-k="${k}">${NAME[k]}</button>`).join('')});
$('#fx').onclick=e=>{const k=e.target.dataset.k;if(!k)return;S.fix=k;if(S.inp===k)S.inp=KEYS.find(q=>q!==k);upd()};
$('#in').onclick=e=>{const k=e.target.dataset.k;if(!k||k===S.fix)return;S.inp=k;upd()};
$('#wi').oninput=e=>{S.win=+e.target.value;info();theory()};
$('#zs').oninput=e=>{S.Zs=+e.target.value;upd()};$('#zp').oninput=e=>{S.Zp=+e.target.value;upd()};
$('#sp').oninput=e=>S.spd=+e.target.value;
$('#pl').onclick=e=>{S.play=!S.play;e.target.textContent=S.play?'Pausa':'Reanudar'};
$('#tb').onclick=e=>{const t=+e.target.dataset.t;if(!t)return;S.tab=t;document.querySelectorAll('#tb button').forEach(b=>b.classList.toggle('on',+b.dataset.t===t));setStep(1)};
$('#pv').onclick=()=>setStep(S.step-1);$('#nx').onclick=()=>setStep(S.step+1);
let last=0;function loop(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;if(S.play){const w=speeds();for(const k in th)th[k]+=w[k]*TAU/60*dt*S.spd}draw();requestAnimationFrame(loop)}
setStep(1);requestAnimationFrame(loop);
</script></body></html>
